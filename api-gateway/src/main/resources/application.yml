server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**,/api/auth/**
        - id: book-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/books/**,/api/copies/**,/api/colleges/**,/api/departments/**
        - id: loan-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/loans/**
