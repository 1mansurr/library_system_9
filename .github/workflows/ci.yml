name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test User Service
        working-directory: ./user-service
        run: mvn clean test

      - name: Build and Test Book Service
        working-directory: ./book-service
        run: mvn clean test

      - name: Build and Test Loan Service
        working-directory: ./loan-service
        run: mvn clean test

      - name: Build and Test API Gateway
        working-directory: ./api-gateway
        run: mvn clean test

  frontend-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Vitest Component Tests
        working-directory: ./frontend
        run: npm run test

      - name: Start Backend Environment (Docker Compose)
        run: docker-compose up -d --build
        env:
          JWT_SECRET: default_ci_secret_key_12345
          SERVICE_TOKEN: default_ci_service_token

      - name: Start API Gateway (Fallback)
        # Starting the API Gateway manually since it isn't in docker-compose.yml yet
        working-directory: ./api-gateway
        run: mvn spring-boot:run &

      - name: Start React Frontend Dev Server
        working-directory: ./frontend
        run: npm run dev &

      - name: Wait for Services to Initialize
        # In a real environment, wait-on would be preferred
        run: sleep 45

      - name: Run Cypress E2E Tests
        working-directory: ./frontend
        run: npm run cypress:run
